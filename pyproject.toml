[project]
name = "mado-backend"
version = "0.1.0"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "asyncio: mark a test as an asyncio coroutine",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
addopts = "--cov=mado.backend --cov-report=term-missing --cov-fail-under=60"
timeout = 30

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
    "F541",  # f-string without placeholders (widespread in prompt construction)
    "F821",  # undefined name (false positive on forward-ref type annotations)
    "E501",  # line too long (handled by line-length)
]

[tool.ruff.lint.per-file-ignores]
"mado/backend/memory/vector_store.py" = ["F401"]  # numpy imported for runtime use
"tests/e2e/*" = ["F841"]  # e2e tests may have unused captures

[tool.ruff.lint.isort]
known-first-party = ["mado"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
ignore_missing_imports = true
no_implicit_optional = false
check_untyped_defs = false
disallow_untyped_defs = false
warn_return_any = false
disable_error_code = [
    "arg-type", "assignment", "no-any-return", "return-value",
    "var-annotated", "union-attr", "import-untyped", "name-defined", "operator",
]

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true
