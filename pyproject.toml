[project]
name = "mado-backend"
version = "0.1.0"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "asyncio: mark a test as an asyncio coroutine",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
addopts = "--cov=mado.backend --cov-report=term-missing --cov-fail-under=60"
